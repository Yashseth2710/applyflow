[project]
name = "applyflow-backend"
version = "0.1.0"
description = "ApplyFlow API"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "SIM",  # simplify
]
ignore = [
    "B008",  # FastAPI's Depends() in defaults is the documented pattern
    # The two below arrived with ruff 0.16. Both are modernisation preferences
    # rather than defects, and both would change something that leaves this
    # process — a poor trade for a tidier base class.
    #
    # UP042: `class X(str, Enum)` -> `StrEnum`. These enums are a native
    # Postgres type, a Pydantic field and a generated OpenAPI member all at
    # once. A str-mixin enum and a StrEnum format differently, so the failure
    # mode is a value reaching the database or the API in a subtly altered
    # form — the kind of thing that passes tests and corrupts rows.
    "UP042",
    # UP046: `Generic[T]` -> PEP 695 type parameters. The only generic here is
    # the pagination wrapper, and its class name is the OpenAPI schema name
    # that the frontend types alias.
    "UP046",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["alembic/", ".venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
asyncio_default_fixture_loop_scope = "function"
