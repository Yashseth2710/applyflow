name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Tests run against a throwaway Postgres, not the Neon database. CI must
    # never touch real data, and the production credentials are not available
    # to pull requests from forks anyway.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: applyflow
          POSTGRES_PASSWORD: applyflow
          POSTGRES_DB: applyflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://applyflow:applyflow@localhost:5432/applyflow_test
      JWT_SECRET: ci-only-secret-not-used-anywhere-real-0123456789abcdef
      ENVIRONMENT: development

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy app

      - name: Run migrations
        run: alembic upgrade head

      - name: Tests
        run: pytest --cov=app --cov-report=term-missing

      # Audits the pinned files rather than the installed environment, so what
      # is checked is what a deploy would actually install. After the tests on
      # purpose: a known CVE is worth failing a build over, but not before the
      # more informative failure has had its chance to happen.
      - name: Audit dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt -r requirements-dev.txt --progress-spinner off

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Next generates route types (LayoutProps, PageProps) into .next/types.
      # tsc can't resolve them on a clean checkout unless typegen runs first.
      - name: Generate route types
        run: npx next typegen

      - name: Type check
        run: npx tsc --noEmit

      # No --passWithNoTests: there are tests now, and a run that finds none
      # means they stopped being picked up, which should fail rather than pass.
      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1

      # --omit=dev would hide most of it: nearly everything here is a build or
      # test tool, and a compromised one still runs on this machine with the
      # repository checked out. --audit-level=high keeps the build from failing
      # over the low-severity noise that npm reports constantly.
      - name: Audit dependencies
        run: npm audit --audit-level=high
